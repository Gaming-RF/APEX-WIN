# /etc/binfmt.d/windows-pe.conf
# Registers win-sandbox-runner as the handler for Windows PE (MZ) executables.
# Flags: P = preserve argv[0], F = fix binary (keep fd open for scripts)
# C (credentials) intentionally omitted to prevent privilege escalation.
:Windows_PE:M:0:MZ::/usr/bin/win-sandbox-runner:PF
